    <style>
        /* GENEL AYARLAR */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: #121212; color: #e0e0e0; overflow-x: hidden; }

        /* HEADER & HERO BÖLÜMÜ */
        header { position: relative; width: 100%; height: 40vh; background: url('https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&q=80&w=1600') center/cover no-repeat; display: flex; align-items: center; justify-content: center; }
        header::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.7); z-index: 1; }
        
        .logo-img { position: relative; z-index: 2; width: 100%; max-width: 400px; height: auto; filter: drop-shadow(0px 4px 12px rgba(0, 0, 0, 0.8)); transition: all 0.3s ease; }

        /* ANA İÇERİK */
        main { max-width: 1200px; margin: -40px auto 40px; padding: 20px; position: relative; z-index: 3; }

        /* 3 ANA KATEGORİ KUTUSU */
        .main-categories { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; transition: all 0.3s ease; }
        .category-box { background: rgba(30, 30, 30, 0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; overflow: hidden; cursor: pointer; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5); transition: transform 0.3s ease, border-color 0.3s ease; }
        .category-box:hover { transform: translateY(-5px); border-color: rgba(255, 255, 255, 0.3); }
        .category-box img { width: 100%; height: 250px; object-fit: cover; opacity: 0.85; transition: opacity 0.3s ease; }
        .category-box:hover img { opacity: 1; }
        .category-box h2 { text-align: center; padding: 18px; font-size: 1.3rem; font-weight: 600; color: #ffffff; letter-spacing: 1px; }

        /* DETAYLI MENÜ ALANI */
        .menu-details { display: none; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 25px; padding: 10px 20px; background: #2a2a2a; border: 1px solid #444; border-radius: 8px; cursor: pointer; font-weight: 400; color: #e0e0e0; transition: all 0.3s ease; }
        .back-btn:hover { background: #444; color: #fff; }

        /* YENİ: MODERN İÇ İÇE AKORDİYON TASARIMI (Grid Animasyonu İle) */
        .accordion-item { background: rgba(35, 35, 35, 0.8); border: 1px solid #3a3a3a; border-radius: 10px; margin-bottom: 15px; overflow: hidden; }
        .accordion-header { padding: 20px; font-size: 1.1rem; font-weight: 600; color: #ffffff; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: #222; transition: background 0.3s ease; }
        .accordion-header:hover { background: #2a2a2a; }
        
        .accordion-wrapper { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.4s ease-out; background: #1a1a1a; }
        .accordion-wrapper.open { grid-template-rows: 1fr; }
        .accordion-inner { overflow: hidden; }

        /* ALT BAŞLIK AKORDİYONU */
        .sub-accordion-header { 
            padding: 20px 20px 10px; 
            font-size: 0.95rem; 
            font-weight: 700; 
            color: #aaaaaa; 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
            border-bottom: 2px solid #444; 
            margin: 0 15px 5px; 
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: color 0.3s ease;
        }
        .sub-accordion-header:hover { color: #ffffff; }
        .sub-accordion-wrapper { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.4s ease-out; }
        .sub-accordion-wrapper.open { grid-template-rows: 1fr; }
        .sub-accordion-inner { overflow: hidden; }

        /* ÜRÜN IZGARA (GRID) DÜZENİ */
        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 15px; }

        /* KART TİPİ ÜRÜN LİSTELEME */
        .product-item { display: flex; flex-direction: column; background: rgba(40, 40, 40, 0.4); border: 1px solid #333; border-radius: 12px; padding: 12px; align-items: center; text-align: center; transition: transform 0.3s ease, background 0.3s ease; }
        .product-item:hover { transform: translateY(-4px); background: rgba(50, 50, 50, 0.6); border-color: #555; }
        .product-img { width: 100%; height: 110px; border-radius: 8px; object-fit: cover; margin-bottom: 12px; }
        .product-info { display: flex; flex-direction: column; flex-grow: 1; width: 100%; }
        .product-name { font-weight: 600; font-size: 0.95rem; color: #ffffff; margin-bottom: 6px; }
        .product-desc { font-size: 0.75rem; color: #999999; line-height: 1.4; font-weight: 300; margin-bottom: 12px; flex-grow: 1; }
        .product-price { font-weight: 700; font-size: 1rem; color: #ffffff; background: #1a1a1a; padding: 6px 12px; border-radius: 6px; border: 1px solid #333; width: 100%; }
        .no-image-box {
            width: 100%;
            height: 110px;
            border-radius: 8px;
            margin-bottom: 12px;
            background: #1a1a1a;
            border: 1px dashed #555;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 0.75rem;
            color: #888;
            font-style: italic;
            padding: 10px;
            line-height: 1.4;
            transition: all 0.3s ease;
        }
        .product-item:hover .no-image-box {
            border-color: #888;
            color: #ccc;
        }


        /* FOOTER */
        footer { background: #181818; border-top: 1px solid #333; padding: 50px 20px; margin-top: 60px; }
        .footer-content { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        .contact-info h3 { font-size: 1.2rem; font-weight: 600; color: #ffffff; margin-bottom: 20px; letter-spacing: 1px; }
        .contact-info p { margin-bottom: 12px; color: #aaaaaa; line-height: 1.6; font-size: 0.95rem; }
        .contact-info strong { color: #dddddd; }
        .social-buttons { margin-top: 20px; display: flex; gap: 15px; }
        .social-buttons a { display: flex; align-items: center; justify-content: center; width: 45px; height: 45px; background: #2a2a2a; color: #ffffff; text-decoration: none; border-radius: 50%; font-size: 1.3rem; transition: all 0.3s ease; border: 1px solid #444; }
        .social-buttons a:hover { background: #444; transform: translateY(-3px); border-color: #666; }
        .map-container iframe { width: 100%; height: 220px; border: none; border-radius: 10px; opacity: 0.85; transition: opacity 0.3s ease; }
        .map-container iframe:hover { opacity: 1; }

        /* BÜYÜK EKRAN (MASAÜSTÜ) UYUMU */
        @media (min-width: 769px) { .products-grid { grid-template-columns: repeat(3, 1fr); } }

        /* MOBİL UYUM */
        @media (max-width: 768px) {
            .logo-img { max-width: 260px; }
            .main-categories { grid-template-columns: 1fr; }
            .category-box img { height: 180px; }
            .footer-content { grid-template-columns: 1fr; }
            .product-name { font-size: 0.85rem; }
            .product-desc { font-size: 0.7rem; }
            .product-price { font-size: 0.9rem; padding: 5px 10px; }
            .product-img { height: 90px; } 
        }
    </style>
</head>

                                { isim: "Thai Beef Salata", aciklama: "Göbek Marul-Domates – Salata- Jülyen Dana –Mantar –Mısır- Soya Sosu – Çıtır Ekmek ile Servis Edilir.", fiyat: "450 ₺", resim: "images/thai_beef.avif" }
                            ]
                        }
                    ]
                },
                {
                    akordiyonBaslik: "Çorbalar",
                    altBolumler: [
                        {
                            baslik: "",
                            urunler: [
                                { isim: "Günün Çorbası", aciklama: "Servis Personelimize Danışınız!", fiyat: "200 ₺", resim: "images/corba.avif" }
                            ]
                        }
                    ]
                }
            ],
        };

        // ==========================================

        const mainCategories = document.getElementById('mainCategories');
        const menuDetails = document.getElementById('menuDetails');
        const dynamicContent = document.getElementById('dynamicContent');

        function showCategory(categoryID) {
            mainCategories.style.display = 'none';
            menuDetails.style.display = 'block';
            
            const veri = menuVerileri[categoryID];
            let htmlIcerik = "";

            if(veri && veri.length > 0) {
                veri.forEach(akordiyon => {
                    htmlIcerik += `
                    <div class="accordion-item">
                        <div class="accordion-header" onclick="toggleAccordion(this)">
                            ${akordiyon.akordiyonBaslik} <span><i class="fas fa-plus"></i></span>
                        </div>
                        <div class="accordion-wrapper">
                            <div class="accordion-inner">
                    `;

                    akordiyon.altBolumler.forEach(bolum => {
                        
                        if(bolum.baslik !== "") {
                            htmlIcerik += `
                            <div class="sub-accordion-header" onclick="toggleAccordion(this)">
                                ${bolum.baslik} <span><i class="fas fa-plus"></i></span>
                            </div>
                            <div class="sub-accordion-wrapper">
                                <div class="sub-accordion-inner">
                            `;
                        }
                        
                        htmlIcerik += `<div class="products-grid">`;

                        bolum.urunler.forEach(urun => {
                            
                            let resimGorsel = "";
                            if (urun.resim && urun.resim !== "") {
                                resimGorsel = `<img src="${urun.resim}" alt="${urun.isim}" class="product-img" loading="lazy" decoding="async">`;
                            } else {
                                resimGorsel = `<div class="no-image-box">Görsel Yok.<br>Kendin Görmek İster Misin?</div>`;
                            }

                            htmlIcerik += `
                            <div class="product-item">
                                ${resimGorsel}
                                <div class="product-info">
                                    <div class="product-name">${urun.isim}</div>
                                    <div class="product-desc">${urun.aciklama}</div>
                                </div>
                                <div class="product-price">${urun.fiyat}</div>
                            </div>
                            `;
                        });
                        
                        htmlIcerik += `</div>`; 

                        if(bolum.baslik !== "") {
                            htmlIcerik += `
                                </div>
                            </div>
                            `;
                        }
                    });

                    htmlIcerik += `
                            </div>
                        </div>
                    </div>
                    `;
                });
                
                dynamicContent.innerHTML = htmlIcerik;
            } else {
                dynamicContent.innerHTML = '<p style="text-align:center; padding: 40px; color:#aaaaaa;">Bu kategori için içerikler hazırlanıyor...</p>';
            }
        }

        function goBack() {
            menuDetails.style.display = 'none';
            mainCategories.style.display = 'grid';
            dynamicContent.innerHTML = '';
        }

        function toggleAccordion(element) {
            const wrapper = element.nextElementSibling; 
            const icon = element.querySelector('span i');
            const isOpen = wrapper.classList.contains('open');
            
            if (element.classList.contains('accordion-header')) {
                document.querySelectorAll('.accordion-wrapper').forEach(w => w.classList.remove('open'));
                document.querySelectorAll('.accordion-header span i').forEach(i => i.className = 'fas fa-plus');
            } 
            else if (element.classList.contains('sub-accordion-header')) {
                const parentInner = element.closest('.accordion-inner');
                if(parentInner) {
                    parentInner.querySelectorAll('.sub-accordion-wrapper').forEach(w => w.classList.remove('open'));
                    parentInner.querySelectorAll('.sub-accordion-header span i').forEach(i => i.className = 'fas fa-plus');
                }
            }

            if (!isOpen) {
                wrapper.classList.add('open');
                if (icon) icon.className = 'fas fa-minus';
            }
        }
    </script>
</body>
</html>
